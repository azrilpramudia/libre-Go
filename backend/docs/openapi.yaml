openapi: 3.0.3
info:
  title: Libre-Go API
  version: 1.0.0
  description: Backend API for the library book catalog, members, authentication, and loans.
servers:
  - url: http://localhost:5000
    description: Local development server
tags:
  - name: Health
  - name: Auth
  - name: Books
  - name: Members
  - name: Loans
paths:
  /health:
    get:
      tags: [Health]
      summary: Check the server health
      responses:
        "200":
          description: The server is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a member and create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [token]
                        properties:
                          token:
                            type: string
                            description: JWT valid for 24 hours.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /books:
    post:
      tags: [Books]
      summary: Create a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookRequest"
      responses:
        "201":
          description: Book created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Books]
      summary: List books
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Book list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Book"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /books/{id}:
    get:
      tags: [Books]
      summary: Get a book by ID
      parameters:
        - $ref: "#/components/parameters/UUIDPath"
      responses:
        "200":
          description: Book details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Book"
        "400":
          description: ID is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /books/search/openlibrary:
    get:
      tags: [Books]
      summary: Search Open Library by book title
      parameters:
        - name: title
          in: query
          required: true
          description: Title of the book to search for
          schema:
            type: string
      responses:
        "200":
          description: Open Library search results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OpenLibrarySearchResult"
        "400":
          description: The title parameter is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Open Library could not be reached or returned an invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /books/import/openlibrary:
    post:
      tags: [Books]
      summary: Import a book using Open Library data
      description: Stock is set to 1 if its value is less than 1 or is not provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportBookRequest"
      responses:
        "201":
          description: Book imported successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
  /members:
    post:
      tags: [Members]
      summary: Create a member record without a login account
      description: To create an account that can log in, use POST /auth/register.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "201":
          description: Member created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Members]
      summary: List members
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Member"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /members/{id}:
    get:
      tags: [Members]
      summary: Get a member by ID
      parameters:
        - $ref: "#/components/parameters/UUIDPath"
      responses:
        "200":
          description: Member details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Member"
        "400":
          description: ID is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /loans/borrow:
    post:
      tags: [Loans]
      summary: Borrow a book
      description: Requires a bearer token. The due date is set to 7 days after borrowing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BorrowRequest"
      responses:
        "201":
          description: Loan created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Loan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Book is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /loans/{id}/return:
    patch:
      tags: [Loans]
      summary: Return a book
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPath"
      responses:
        "200":
          description: Book returned successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Loan"
        "400":
          description: ID is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Loan has already been returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /loans/member/{memberId}:
    get:
      tags: [Loans]
      summary: List loans for a member
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          description: Member UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Member loan list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Loan"
        "400":
          description: memberId is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UUIDPath:
      name: id
      in: path
      required: true
      description: UUID resource
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (default 10)
      schema:
        type: integer
        default: 10
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip (default 0)
      schema:
        type: integer
        default: 0
  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Bearer token is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalServerError:
      description: An internal server error occurred
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          description: Response data
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
    RegisterRequest:
      type: object
      required: [full_name, email, password]
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
          minLength: 6
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    CreateBookRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        isbn:
          type: string
        stock:
          type: integer
          format: int32
          default: 1
    ImportBookRequest:
      type: object
      required: [title, key]
      properties:
        title:
          type: string
        author_name:
          type: string
        isbn:
          type: string
        cover_i:
          type: integer
        key:
          type: string
          description: Open Library work key, for example /works/OL45883W
        stock:
          type: integer
          format: int32
          default: 1
    CreateMemberRequest:
      type: object
      required: [full_name, email]
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
    BorrowRequest:
      type: object
      required: [book_id, member_id]
      properties:
        book_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
    Book:
      type: object
      required: [ID, Title, ISBN, OpenLibraryID, CoverURL, CategoryID, Stock, Available, CreatedAt, UpdatedAt]
      properties:
        ID:
          type: string
          format: uuid
        Title:
          type: string
        ISBN:
          type: string
        OpenLibraryID:
          type: string
        CoverURL:
          type: string
        CategoryID:
          type: string
          format: uuid
          nullable: true
        Stock:
          type: integer
          format: int32
        Available:
          type: integer
          format: int32
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
    Member:
      type: object
      required: [ID, FullName, Email, Phone, PasswordHash, CreatedAt]
      properties:
        ID:
          type: string
          format: uuid
        FullName:
          type: string
        Email:
          type: string
          format: email
        Phone:
          type: string
        PasswordHash:
          type: string
          description: The password hash currently serialized by the member model.
        CreatedAt:
          type: string
          format: date-time
    Loan:
      type: object
      required: [ID, BookID, MemberID, BorrowedAt, DueAt, ReturnedAt, Status, FineAmount]
      properties:
        ID:
          type: string
          format: uuid
        BookID:
          type: string
          format: uuid
        MemberID:
          type: string
          format: uuid
        BorrowedAt:
          type: string
          format: date-time
        DueAt:
          type: string
          format: date-time
        ReturnedAt:
          type: string
          format: date-time
          nullable: true
        Status:
          type: string
        FineAmount:
          type: integer
    OpenLibrarySearchResult:
      type: object
      required: [docs]
      properties:
        docs:
          type: array
          items:
            type: object
            required: [title, author_name, isbn, cover_i, key]
            properties:
              title:
                type: string
              author_name:
                type: array
                items:
                  type: string
              isbn:
                type: array
                items:
                  type: string
              cover_i:
                type: integer
              key:
                type: string